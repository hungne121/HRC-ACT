name: I1 tests
on:
  pull_request:
  push:
    branches:
      - feat/i1-clean-foundation

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install foundation and tests
        run: python -m pip install -e '.[test]'
      - name: Unit and MuJoCo simulation tests
        env:
          MUJOCO_GL: egl
        run: python -m pytest -q
