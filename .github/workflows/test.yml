name: I1 Observed — original Work robot scene
on:
  pull_request:
    branches: [main]

concurrency:
  group: work-i1-observed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observed_work:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MUJOCO_GL: glfw
      PYTHONPATH: ${{ github.workspace }}/work
    steps:
      - name: Checkout HRC-ACT preview adapter
        uses: actions/checkout@v4
      - name: Checkout original Work robot scene, pinned
        uses: actions/checkout@v4
        with:
          repository: hungne121/intent_policy
          ref: 428e8fcb9d7834eb6e6be98ab72b1ccf9c71ab3a
          path: work
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulation and video dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'mujoco==3.3.7' 'scipy>=1.11' 'PyYAML>=6' 'Pillow>=10' 'av>=12' 'imageio[ffmpeg]>=2.34' 'glfw>=2'
      - name: Render Observed with original Work UR3e + SusGrip
        working-directory: work
        run: xvfb-run -a python ../scripts/work_i1_observed.py --seed 300100 --out ../outputs/work_i1 --speedup 1.0
      - name: Upload actual Observed preview, pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: I1-Observed-Work-UR3e-SusGrip
          path: outputs/work_i1/
          if-no-files-found: warn
          retention-days: 7
