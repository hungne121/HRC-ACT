name: I1 Observed — original Work robot scene
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: work-i1-observed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observed_work:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MUJOCO_GL: glfw
      PYTHONPATH: ${{ github.workspace }}/work
    steps:
      - name: Checkout HRC-ACT preview adapter
        uses: actions/checkout@v4
      - name: Checkout original Work robot scene, pinned
        uses: actions/checkout@v4
        with:
          repository: hungne121/intent_policy
          ref: 428e8fcb9d7834eb6e6be98ab72b1ccf9c71ab3a
          path: work
          persist-credentials: false
      - name: Checkout public ManiCast release and pretrained model
        uses: actions/checkout@v4
        with:
          repository: portal-cornell/manicast
          ref: release
          path: work/third_party/manicast
          filter: blob:none
          sparse-checkout: |
            model
            model_checkpoints/manicast
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulation and video dependencies
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'mujoco==3.3.7' 'scipy>=1.11' 'PyYAML>=6' 'Pillow>=10' 'av>=12' 'imageio[ffmpeg]>=2.34' 'glfw>=2' 'einops>=0.7'
      - name: Render Observed with original Work UR3e + SusGrip
        working-directory: work
        run: |
          xvfb-run -a python ../scripts/work_i1_observed.py --expert observed --robot-profile optimized --layout original --seed 300100 --out ../outputs/i1_original_control --speedup 1.0
          xvfb-run -a python ../scripts/work_i1_observed.py --expert observed --robot-profile optimized --seed 300100 --out ../outputs/work_i1 --speedup 1.0 --layout row
          xvfb-run -a python ../scripts/work_i1_observed.py --expert early --robot-profile optimized --layout row --seed 300100 --out ../outputs/work_i1 --speedup 1.0
      - name: Publish latest MP4s in repository for one-click viewing
        if: success()
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p previews
          cp outputs/work_i1/I1_observed_optimized_work.mp4 previews/I1_Observed.mp4
          cp outputs/work_i1/I1_early_optimized_work.mp4 previews/I1_Intent.mp4
          cat > previews/README.md <<'EOF'
          # I1 — xem video mới nhất

          Chỉ cần lưu trang này vào bookmark. Mỗi lần chạy thành công,
          hai video sau sẽ được cập nhật tự động, không cần tải ZIP hoặc quay lại ChatGPT.

          - **[Xem Observed](I1_Observed.mp4)**
          - **[Xem Intent + ManiCast](I1_Intent.mp4)**

          Cả hai được dựng từ scene MuJoCo Work gốc với cùng seed,
          bố cục ba vị trí trái–giữa–phải và demo điều khiển gripper.
          Đây là scripted expert demo, chưa phải ACT đã train.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/
          if ! git diff --cached --quiet; then
            git commit -m "chore(previews): update latest I1 videos [skip ci]"
            git push origin "HEAD:refs/heads/${PR_HEAD_REF}"
          fi
      - name: Upload actual Observed preview, pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: I1-Observed-Intent-Work-ManiCast
          path: |
            outputs/work_i1/
            outputs/i1_original_control/
          if-no-files-found: warn
          retention-days: 7
