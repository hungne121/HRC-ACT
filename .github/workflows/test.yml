name: I1 Observed preview
on:
  pull_request:
    branches: [main]

concurrency:
  group: i1-observed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Render ONLY observed preview
        run: hrc-i1 --expert observed --seed 300100 --out outputs/I1 --fps 10 --max-seconds 65 --skip-dataset
      - name: Check physics and task outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/I1/I1_observed.json').read_text())
          print('state:',d['state'],'cups:',d['placed'])
          print('deepest contact:',d.get('worst_contact'))
          print('events:',[(e['event'],e['t']) for e in d['events'] if e['event'] in ('grasp','release','place_complete','place_unstable','failed_grasp','unsafe_alignment')])
          assert d['success'] and len(d['placed'])==3,'Observed I1 has not placed 3/3 cups'
          PY
      - name: Upload observed video and physics trace even if unsuccessful
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: I1-observed-seed300100
          path: outputs/I1/I1_observed.*
          if-no-files-found: warn
          retention-days: 7
